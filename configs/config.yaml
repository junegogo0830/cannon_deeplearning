# 실 데이터(EDA 완료, reports/eda_summary.md 참고) 기준으로 채운 설정 파일.
# 여전히 예시/기본값이 섞여 있으니 실험하면서 조정할 것.
project:
  name: cannon_deeplearning
  seed: 42
  device: cpu                  # GPU 미지원 환경

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: results
  reports_dir: reports
  # 라벨은 사람이 만든 CSV가 아니라 data/raw/<기종>/<제품>/NG/ 폴더의 존재 여부·파일명으로만 확인 가능.
  # scripts/build_inventory.py 가 이를 스캔해서 아래 두 파일을 생성한다 (재현 가능, git에는 결과만 커밋).
  inventory_csv: data/processed/eda/inventory.csv     # 전체 (기종,제품,스텝) 목록
  ng_events_csv: data/processed/eda/ng_events.csv     # FAIL로 확인된 (기종,제품,스텝) 목록 (전체 9제품/12건뿐)

data:
  native_size: [768, 1024]     # [H, W] 원본 해상도 — EDA로 전수 표본 확인, 기종/스텝 상관없이 100% 동일
  image_size: [384, 512]       # [H, W] 리사이즈 크기 — CPU 속도를 위해 원본의 절반, 4:3 비율 유지
  extensions: [".jpg"]
  train_normal_only: true      # 학습은 PASS(=NG 폴더에 없는) 이미지로만
  val_ratio: 0.2
  augment: false                # 제품 수가 극소(2~25개)인 기종은 정상 변동성 보강을 위해 true 검토

# EDA(reports/eda_summary.md §5)에서 실측한 핸디형 카메라 정렬 파라미터.
# 이중 게이트: inlier 조건 + 변환값 타당성 조건을 "둘 다" 만족해야 정렬을 신뢰함.
alignment:
  method: affine                # affine(4DOF: 이동/회전/등방배율)만 사용. homography는 매칭 부실 시 과적합 확인됨 → 미사용
  feature: orb
  ransac_reproj_threshold: 5.0
  min_inliers: 15
  min_inlier_ratio: 0.25
  max_abs_dx_px: 200            # 이 이상이면 "물리적으로 비현실적"으로 보고 정렬 실패 처리
  max_abs_dy_px: 150
  max_abs_rotation_deg: 20
  on_failure: exclude            # exclude(학습 제외) | keep_unaligned(원본 그대로 사용) | flag_for_review

features:
  type: handcrafted            # handcrafted | cnn_embedding
  # EDA(§6,§7)에서 조명/반사 변동이 정렬 후에도 잔차 diff의 주요 원인으로 확인됨 → 밝기 원값 직접 사용 지양.
  illumination_robust: true     # true면 엣지 방향/그래디언트 + 채도가중 Hue 위주로 특징 구성 (원본 밝기 배제)
  cnn_backbone: null            # cnn_embedding일 때만 사용 (경량 백본, CPU)
  patch_size: 64                # EDA에서 정렬 잔차가 남는 것을 확인 → 너무 작은 패치는 피함
  stride: 32                    # 오버랩 패치로 잔차 흡수
  multi_scale: [64, 128]        # 결함 스펙트럼이 넓음(라벨 누락 같은 큰 변화 ~ 미세 이음새) → 최소 2개 스케일

model:
  type: patch_knn               # gaussian(베이스라인 비교용) | patch_knn(메인) | autoencoder(데이터 많은 기종 한정 실험)
  params:
    knn_k: 3                    # patch_knn
    coreset_ratio: 0.1          # patch_knn: 메모리뱅크 서브샘플 비율 (대용량 기종용)
    reg_eps: 1.0e-3             # gaussian: 공분산 정규화

scoring:
  patch_aggregation: max        # max | mean | topk_mean
  topk: 10
  normalize: minmax             # none | minmax | zscore (스텝별 학습 정상 분포 기준)

threshold:
  method: percentile            # percentile | mean_std | fail_calibrated
  percentile: 99.0              # 정상 검증 스코어의 상위 분위
  k_std: 3.0                    # mean_std: mean + k * std
  # threshold를 스텝별 직접 지정하면(machine_types.*.steps[].threshold) 위 method보다 우선

decision:
  step_fail_rule: score_gt_threshold   # score > threshold 이면 FAIL
  product_rule: all_steps_pass         # 기종별 전체 스텝 모두 PASS여야 제품 PASS

evaluation:
  # FAIL 라벨이 있는 기종은 3개뿐(9제품) — 나머지 10개 기종은 정량 평가가 원천적으로 불가능 (reports/eda_summary.md §3,§8).
  real_fail_available_machines: [3029C003AA, 3029C004AA, 3029C009AA]
  real_fail_eval_method: leave_one_out   # 표본이 너무 적어 %지표 대신 사례별(case-by-case) 확인
  synthetic_anomaly:
    enabled: true                        # FAIL 라벨 없는 기종 포함 전체에서 정량 비교용
    methods: [cutout_patch, brightness_drop, patch_copy_shift]
    n_per_step: 20

# 기종별 정의 (data/processed/eda/machine_summary.csv 기준, 2026-09-28 EDA 실측).
# roi는 아직 미지정(null=전체 프레임 사용) — 필요시 T595NP_층별일람표_2.xlsx의 체크포인트별 부품 위치를 참고해 채울 것.
# n_steps: 기종 내 전 제품에서 100% 일정함(EDA로 확인, 결측 스텝 0건).
machine_types:
  3029C003AA: {n_steps: 15, image_glob: "3029C003AA/*/step_*.jpg", has_real_fail: true}
  3029C004AA: {n_steps: 18, image_glob: "3029C004AA/*/step_*.jpg", has_real_fail: true}
  3029C005AA: {n_steps: 13, image_glob: "3029C005AA/*/step_*.jpg", has_real_fail: false}
  3029C006AA: {n_steps: 13, image_glob: "3029C006AA/*/step_*.jpg", has_real_fail: false}
  3029C009AA: {n_steps: 15, image_glob: "3029C009AA/*/step_*.jpg", has_real_fail: true}
  3029C010AA: {n_steps: 20, image_glob: "3029C010AA/*/step_*.jpg", has_real_fail: false}
  3030C001AA: {n_steps: 15, image_glob: "3030C001AA/*/step_*.jpg", has_real_fail: false}
  3030C002AA: {n_steps: 15, image_glob: "3030C002AA/*/step_*.jpg", has_real_fail: false}
  3030C003AA: {n_steps: 15, image_glob: "3030C003AA/*/step_*.jpg", has_real_fail: false}
  3030C004AA: {n_steps: 15, image_glob: "3030C004AA/*/step_*.jpg", has_real_fail: false}
  3031C001AA: {n_steps: 15, image_glob: "3031C001AA/*/step_*.jpg", has_real_fail: false}
  3031C002AA: {n_steps: 13, image_glob: "3031C002AA/*/step_*.jpg", has_real_fail: false}
  3031C003AA: {n_steps: 13, image_glob: "3031C003AA/*/step_*.jpg", has_real_fail: false}

eval:
  metrics: [auroc, aupr, f1, precision, recall]
  save_score_csv: true
  save_heatmaps: true
